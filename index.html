<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Bảo Trì</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --border-color: rgba(212, 175, 55, 0.3);
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.5);
            --zalo-blue: #0068ff;
            --zalo-glow: rgba(0, 104, 255, 0.6);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 50%), 
                radial-gradient(circle at 85% 30%, rgba(0, 104, 255, 0.05) 0%, transparent 50%);
            color: #fff;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .maintenance-box {
            width: 100%;
            max-width: 450px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(212, 175, 55, 0.05);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        /* Hiệu ứng viền sáng chạy vòng quanh */
        .maintenance-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, rgba(212, 175, 55, 0.15), transparent 30%);
            animation: rotate 6s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate { 
            100% { transform: rotate(360deg); } 
        }

        @keyframes slideUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 0 0 15px var(--gold-glow);
            position: relative;
            z-index: 1;
        }

        .subtitle {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.5;
            position: relative;
            z-index: 1;
        }

        .zalo-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #0055cc, var(--zalo-blue));
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 25px var(--zalo-glow);
            border: 1px solid #3388ff;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .zalo-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 15px var(--zalo-glow);
        }

        .zalo-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Footer nhỏ chìm */
        .footer {
            margin-top: 35px;
            font-size: 10px;
            color: #444;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="maintenance-box">
        <div class="icon">🛠️</div>
        
        <div class="title">ĐANG BẢO TRÌ</div>
        
        <div class="subtitle">
            Hệ thống đang được nâng cấp để mang lại trải nghiệm tốt nhất.<br>
            Vui lòng liên hệ Admin để được hỗ trợ.
        </div>

        <!-- Nút liên hệ Zalo -->
        <a href="https://zalo.me/0339651811" class="zalo-btn" target="_blank">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 5.92 2 10.75c0 2.76 1.54 5.21 3.94 6.79L5 22l4.91-2.54c.68.14 1.38.21 2.09.21 5.52 0 10-3.92 10-8.75S17.52 2 12 2zm1.25 12.5h-2.5v-2.5h2.5v2.5zm0-4.17h-2.5V5.83h2.5v4.5z"/>
            </svg>
            ZALO: 0339651811
        </a>

        <div class="footer">
            DEV TUAN ANH
        </div>
    </div>

</body>
</html>
